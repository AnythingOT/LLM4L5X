name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # Confidential names must never enter the repo. The pattern lives only in the repository secret
      # CONFIDENTIAL_PATTERN (an extended regex, e.g. NAME1|NAME2). Only file names are printed, never the
      # matching lines: a line would show the confidential word in the log.
      - name: Confidential-name check
        env:
          PATTERN: ${{ secrets.CONFIDENTIAL_PATTERN }}
        run: |
          if [ -z "$PATTERN" ]; then
            echo "::error::Repository secret CONFIDENTIAL_PATTERN is not set; the check cannot run."
            exit 1
          fi
          hits=$(git grep -lIiE -e "$PATTERN" -- . || true)
          if [ -n "$hits" ]; then
            echo "::error::Confidential names found in:"
            echo "$hits"
            exit 1
          fi
          echo "No confidential names in $(git ls-files | wc -l) tracked files."

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt ruff==0.16.9

      - name: Lint
        run: ruff check .

      # Public L5X exports at pinned commits (eval/corpus_sources.txt), never committed: tests/test_corpus.py
      # runs every feature on each one. Fetched again only when the list changes.
      - name: Cache public L5X corpus
        id: corpus
        uses: actions/cache@v4
        with:
          path: corpus
          key: corpus-${{ hashFiles('eval/corpus_sources.txt', 'eval/fetch_corpus.py') }}

      - name: Fetch public L5X corpus
        if: steps.corpus.outputs.cache-hit != 'true'
        run: python -m eval.fetch_corpus corpus

      - name: Tests
        env:
          LLM4L5X_CORPUS: corpus
        run: python -m pytest -q

      - name: Measure the corpus (the numbers in tests/TEST_STATUS.md)
        run: python -m eval.test_status corpus

  # The users run Windows: the same tests there (without the public corpus, which the Linux job covers).
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Tests
        run: python -m pytest -q
      - name: Conformance cases run on the simulator
        run: python -m eval.conformance --sim
