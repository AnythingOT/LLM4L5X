# Instruction catalog: the single source of truth for the parser, validator,
# compiler, simulator and prompt snippets.
#
# Core set hand-checked; operand counts of everything below were confirmed
# against 3,160 rungs from public Studio 5000 exports (2026-11-17), except
# entries marked 'not seen in samples'. Semantics come from Rockwell docs.
#
# kind:
#   input   - a condition instruction; passes rung power only when true
#   output  - acts on rung power and passes it through unchanged
# operand fields:
#   name    - operand name
#   type    - BOOL | NUMERIC | TIMER | COUNTER | ANY | ROUTINE | EXPR
#             | NAME (an object/class/attribute name, not a tag)
#   role    - read | write | struct (control structure, read and written)
#             | display (shown on the instruction, really a tag member;
#               exported as "?" -- confirmed, see docs/DESIGN.md section 9)
#   member  - for display operands: the member of the struct operand it shows

XIC:
  kind: input
  description: Examine if closed. True when the bit is 1.
  operands:
    - {name: data_bit, type: BOOL, role: read}

XIO:
  kind: input
  description: Examine if open. True when the bit is 0.
  operands:
    - {name: data_bit, type: BOOL, role: read}

OTE:
  kind: output
  description: Output energize. Writes rung condition to the bit every scan.
  operands:
    - {name: output_bit, type: BOOL, role: write}

OTL:
  kind: output
  description: Output latch. Sets the bit when the rung is true; never clears it.
  operands:
    - {name: output_bit, type: BOOL, role: write}

OTU:
  kind: output
  description: Output unlatch. Clears the bit when the rung is true.
  operands:
    - {name: output_bit, type: BOOL, role: write}

ONS:
  kind: input
  description: One shot. True for one scan when rung-condition-in goes false to true. Needs a unique storage bit per instance.
  operands:
    - {name: storage_bit, type: BOOL, role: struct}

TON:
  kind: output
  description: Timer on delay. DN sets after the rung has been true for PRE milliseconds.
  operands:
    - {name: timer, type: TIMER, role: struct}
    - {name: preset, type: NUMERIC, role: display, member: PRE}
    - {name: accum, type: NUMERIC, role: display, member: ACC}

TOF:
  kind: output
  description: Timer off delay. DN clears PRE milliseconds after the rung goes false.
  operands:
    - {name: timer, type: TIMER, role: struct}
    - {name: preset, type: NUMERIC, role: display, member: PRE}
    - {name: accum, type: NUMERIC, role: display, member: ACC}

RTO:
  kind: output
  description: Retentive timer on. Accumulates while true, keeps ACC when false. Reset with RES.
  operands:
    - {name: timer, type: TIMER, role: struct}
    - {name: preset, type: NUMERIC, role: display, member: PRE}
    - {name: accum, type: NUMERIC, role: display, member: ACC}

CTU:
  kind: output
  description: Count up. ACC increments on each false-to-true rung transition.
  operands:
    - {name: counter, type: COUNTER, role: struct}
    - {name: preset, type: NUMERIC, role: display, member: PRE}
    - {name: accum, type: NUMERIC, role: display, member: ACC}

CTD:
  kind: output
  description: Count down. ACC decrements on each false-to-true rung transition.
  operands:
    - {name: counter, type: COUNTER, role: struct}
    - {name: preset, type: NUMERIC, role: display, member: PRE}
    - {name: accum, type: NUMERIC, role: display, member: ACC}

RES:
  kind: output
  description: Reset a timer or counter structure.
  operands:
    - {name: structure, type: ANY, role: struct}

EQU:
  kind: input
  description: Equal. True when A = B.
  operands:
    - {name: source_a, type: NUMERIC, role: read}
    - {name: source_b, type: NUMERIC, role: read}

NEQ:
  kind: input
  description: Not equal. True when A <> B.
  operands:
    - {name: source_a, type: NUMERIC, role: read}
    - {name: source_b, type: NUMERIC, role: read}

GRT:
  kind: input
  description: Greater than. True when A > B.
  operands:
    - {name: source_a, type: NUMERIC, role: read}
    - {name: source_b, type: NUMERIC, role: read}

LES:
  kind: input
  description: Less than. True when A < B.
  operands:
    - {name: source_a, type: NUMERIC, role: read}
    - {name: source_b, type: NUMERIC, role: read}

GEQ:
  kind: input
  description: Greater than or equal. True when A >= B.
  operands:
    - {name: source_a, type: NUMERIC, role: read}
    - {name: source_b, type: NUMERIC, role: read}

LEQ:
  kind: input
  description: Less than or equal. True when A <= B.
  operands:
    - {name: source_a, type: NUMERIC, role: read}
    - {name: source_b, type: NUMERIC, role: read}

LIM:
  kind: input
  description: Limit test. True when Test is between Low and High.
  operands:
    - {name: low_limit, type: NUMERIC, role: read}
    - {name: test, type: NUMERIC, role: read}
    - {name: high_limit, type: NUMERIC, role: read}

MOV:
  kind: output
  description: Move. Dest = Source.
  operands:
    - {name: source, type: NUMERIC, role: read}
    - {name: dest, type: NUMERIC, role: write}

ADD:
  kind: output
  description: Add. Dest = A + B.
  operands:
    - {name: source_a, type: NUMERIC, role: read}
    - {name: source_b, type: NUMERIC, role: read}
    - {name: dest, type: NUMERIC, role: write}

SUB:
  kind: output
  description: Subtract. Dest = A - B.
  operands:
    - {name: source_a, type: NUMERIC, role: read}
    - {name: source_b, type: NUMERIC, role: read}
    - {name: dest, type: NUMERIC, role: write}

MUL:
  kind: output
  description: Multiply. Dest = A * B.
  operands:
    - {name: source_a, type: NUMERIC, role: read}
    - {name: source_b, type: NUMERIC, role: read}
    - {name: dest, type: NUMERIC, role: write}

DIV:
  kind: output
  description: Divide. Dest = A / B.
  operands:
    - {name: source_a, type: NUMERIC, role: read}
    - {name: source_b, type: NUMERIC, role: read}
    - {name: dest, type: NUMERIC, role: write}

CLR:
  kind: output
  description: Clear. Dest = 0.
  operands:
    - {name: dest, type: NUMERIC, role: write}

COP:
  kind: output
  description: Copy file. Copies Length elements from Source to Dest.
  operands:
    - {name: source, type: ANY, role: read}
    - {name: dest, type: ANY, role: write}
    - {name: length, type: NUMERIC, role: read}

CPT:
  kind: output
  description: Compute. Dest = expression.
  operands:
    - {name: dest, type: NUMERIC, role: write}
    - {name: expression, type: EXPR, role: read}

NOP:
  kind: output
  description: No operation.
  operands: []

AFI:
  kind: input
  description: Always false. Used to disable a rung.
  operands: []

JSR:
  kind: output
  description: Jump to subroutine. Further operands are input/return parameters.
  variadic: true
  operands:
    - {name: routine_name, type: ROUTINE, role: read}
    - {name: input_count, type: NUMERIC, role: read}

OSR:
  kind: output
  description: One shot rising with output. Output bit is true for one scan when the rung goes true.
  operands:
    - {name: storage_bit, type: BOOL, role: struct}
    - {name: output_bit, type: BOOL, role: write}

OSF:
  kind: output
  description: One shot falling with output (not seen in samples).
  operands:
    - {name: storage_bit, type: BOOL, role: struct}
    - {name: output_bit, type: BOOL, role: write}

MOVE:
  kind: output
  description: Move (appears in Rockwell's own sample exports; treated like MOV).
  operands:
    - {name: source, type: ANY, role: read}
    - {name: dest, type: ANY, role: write}

CMP:
  kind: input
  description: Compare. True when the expression is true.
  operands:
    - {name: expression, type: EXPR, role: read}

MOD:
  kind: output
  description: Modulo. Dest = A MOD B.
  operands:
    - {name: source_a, type: NUMERIC, role: read}
    - {name: source_b, type: NUMERIC, role: read}
    - {name: dest, type: NUMERIC, role: write}

NEG:
  kind: output
  description: Negate. Dest = -Source (not seen in samples).
  operands:
    - {name: source, type: NUMERIC, role: read}
    - {name: dest, type: NUMERIC, role: write}

ABS:
  kind: output
  description: Absolute value (not seen in samples).
  operands:
    - {name: source, type: NUMERIC, role: read}
    - {name: dest, type: NUMERIC, role: write}

FLL:
  kind: output
  description: File fill. Fills Length elements of Dest with Source.
  operands:
    - {name: source, type: ANY, role: read}
    - {name: dest, type: ANY, role: write}
    - {name: length, type: NUMERIC, role: read}

MVM:
  kind: output
  description: Masked move. Dest = (Source AND Mask) OR (Dest AND NOT Mask).
  operands:
    - {name: source, type: NUMERIC, role: read}
    - {name: mask, type: NUMERIC, role: read}
    - {name: dest, type: NUMERIC, role: write}

CONCAT:
  kind: output
  description: String concatenate. Dest = A + B.
  operands:
    - {name: source_a, type: ANY, role: read}
    - {name: source_b, type: ANY, role: read}
    - {name: dest, type: ANY, role: write}

RTOS:
  kind: output
  description: Real to string.
  operands:
    - {name: source, type: NUMERIC, role: read}
    - {name: dest, type: ANY, role: write}

GSV:
  kind: output
  description: Get system value.
  operands:
    - {name: class_name, type: NAME, role: read}
    - {name: instance_name, type: NAME, role: read}
    - {name: attribute_name, type: NAME, role: read}
    - {name: dest, type: ANY, role: write}

SSV:
  kind: output
  description: Set system value.
  operands:
    - {name: class_name, type: NAME, role: read}
    - {name: instance_name, type: NAME, role: read}
    - {name: attribute_name, type: NAME, role: read}
    - {name: source, type: ANY, role: read}

EVENT:
  kind: output
  description: Trigger an event task.
  operands:
    - {name: task, type: NAME, role: read}

PID:
  kind: output
  description: PID loop.
  operands:
    - {name: pid, type: ANY, role: struct}
    - {name: process_variable, type: ANY, role: read}
    - {name: tieback, type: ANY, role: read}
    - {name: control_variable, type: ANY, role: write}
    - {name: feedforward, type: ANY, role: read}
    - {name: alarm_disable, type: ANY, role: read}
    - {name: hold, type: ANY, role: read}
