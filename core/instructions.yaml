    - {name: source, type: ANY, role: read}
    - {name: destination, type: ANY, role: write}


DTR:
  kind: input
  operands:
    - {name: source, type: ANY, role: read}
    - {name: mask, type: ANY, role: read}
    - {name: reference, type: ANY, role: struct}


EOT:
  kind: output
  operands:
    - {name: data_bit, type: BOOL, role: read}


ESTOP:
