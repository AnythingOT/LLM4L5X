[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "llm4l5x"
version = "0.1.0"
description = "LogicSpec to Studio 5000 ladder (L5X) compiler, reader and validator for local-LLM code generation"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
dependencies = ["lxml>=4.9", "PyYAML>=6"]

[project.optional-dependencies]
test = ["pytest>=7"]

[project.scripts]
llm4l5x = "llm4l5x.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"llm4l5x.catalog" = ["instructions.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "tests"]
