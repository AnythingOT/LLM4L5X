<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>LLM4L5X</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}" />
    <link rel="icon" href="{{ url_for('static', filename='favicon.ico') }}" type="image/x-icon">
</head>
<body>
    <div class="header">
        <h1>LLM4L5X</h1>
        <span id="projectBadge" class="project-badge" hidden>
            <span id="projectName"></span>
            <button id="detachButton" title="Detach project">&times;</button>
        </span>
        <button id="toggleTheme" title="Toggle dark/light mode">🌓</button>
        <button id="settingsButton" title="Settings">⚙️</button>
    </div>

    <main id="container">
        <div id="chatWindow"></div>

        <div id="inputWrapper">
            <div class="chips" id="chips">
                <button class="chip" data-text="help">help</button>
                <button class="chip" data-text="Pump := (Start_PB OR Pump) AND NOT Stop_PB AND NOT Fault;">seal-in</button>
                <button class="chip" data-text="Alarm := DELAY(Level > 80.0, 5s) AND NOT Muted;">delay</button>
                <button class="chip" data-text="IF RISE(Part_Sensor) THEN COUNT_UP(Parts, 10), Total := Total + 1;">counter</button>
                <button class="chip" data-text="XIC(a)[XIC(b) ,XIO(c) ]OTE(d);">explain rung</button>
                <button class="chip project-only" data-text="decompile" hidden>decompile project</button>
                <button class="chip project-only" data-text="validate" hidden>validate project</button>
            </div>
            <div class="input-row">
                <div class="input-with-buttons">
                    <button id="attachButton" title="Attach an .L5X export">Attach</button>
                    <textarea id="inputBox" placeholder="Type LogicSpec, paste rung text, or 'help'   (Enter = send, Shift+Enter = new line)"></textarea>
                    <button id="enterButton" title="Send" disabled>Enter</button>
                </div>
            </div>
            <input type="file" id="fileInput" accept=".l5x,.L5X" hidden />
        </div>

        <div id="settingsModal" class="modal">
            <div class="modal-content">
                <span class="close-button" title="Close">&times;</span>
                <h2>Settings</h2>
                <p class="modal-description">Saved in this browser. Applied to the next message.</p>
                <div class="settings-grid">
                    <label for="setOutput">Download as</label>
                    <select id="setOutput">
                        <option value="rungs">Rungs (paste into a routine)</option>
                        <option value="routine">New routine</option>
                    </select>

                    <label for="setRoutine">Routine name</label>
                    <input id="setRoutine" type="text" />

                    <label for="setProgram">Program</label>
                    <input id="setProgram" type="text" list="programList" />
                    <datalist id="programList"></datalist>

                    <label for="setController">Controller name</label>
                    <input id="setController" type="text" />

                    <label for="setRevision">Software revision</label>
                    <input id="setRevision" type="text" />

                    <label for="setScope">New tags in</label>
                    <select id="setScope">
                        <option value="controller">Controller scope</option>
                        <option value="program">Program scope</option>
                    </select>

                    <label for="setDisplay">Timer/counter operands</label>
                    <select id="setDisplay">
                        <option value="placeholder">TON(T,?,?) &mdash; preset in tag data</option>
                        <option value="values">TON(T,5000,0)</option>
                    </select>

                    <label for="setPrefix">Auto tag prefix</label>
                    <input id="setPrefix" type="text" />

                    <label for="setComments">Rung comments</label>
                    <input id="setComments" type="checkbox" />
                </div>
                <div class="modal-actions">
                    <button id="resetSettings" class="modal-button">Reset</button>
                    <button id="saveSettings" class="modal-button primary-button">Save</button>
                </div>
            </div>
        </div>
    </main>

    <footer>LLM4L5X &middot; runs locally &middot; review every rung before importing</footer>

    <script src="{{ url_for('static', filename='app.js') }}"></script>
</body>
</html>
