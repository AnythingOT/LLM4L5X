<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>LLM4L5X</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}" />
    <link rel="icon" href="{{ url_for('static', filename='favicon.ico') }}" type="image/x-icon">
</head>
<body>
    <div class="header">
        <h1>LLM4L5X</h1>
        <span id="projectBadge" class="project-badge" hidden>
            <span id="projectName"></span>
            <button id="detachButton" title="Detach project">&times;</button>
        </span>
        <button id="modelBadge" class="model-badge" title="Model connection - click to change">
            <span id="modelDot" class="dot"></span><span id="modelBadgeText">model</span>
        </button>
        <button id="toggleTheme" title="Toggle dark/light mode">🌓</button>
        <button id="settingsButton" title="Settings">⚙️</button>
    </div>

    <main id="container">
        <div id="chatWindow"></div>

        <div id="inputWrapper">
            <div class="chips" id="chips">
                <button class="chip" data-text="help">help</button>
                <button class="chip" data-text="Start the pump with the start button and keep it running until the stop button is pressed or the pump faults.">pump start/stop</button>
                <button class="chip" data-text="Raise the high level alarm when the level stays above 80 for 5 seconds, unless the alarm is muted.">delayed alarm</button>
                <button class="chip" data-text="Count parts on the part sensor; the batch is complete at 10 parts.">counter</button>
                <button class="chip" data-text="Pump := (Start_PB OR Pump) AND NOT Stop_PB;">LogicSpec</button>
                <button class="chip" data-text="XIC(a)[XIC(b) ,XIO(c) ]OTE(d);">explain rung</button>
                <button class="chip" data-text="XIC Start BST XIC Run NXB XIO Stop BND OTE Motor">ASCII rung</button>
                <button class="chip project-only" data-text="decompile" hidden>decompile project</button>
                <button class="chip project-only" data-text="validate" hidden>validate project</button>
            </div>
            <div class="input-row">
                <div class="input-with-buttons">
                    <button id="attachButton" title="Attach an .L5X export">Attach</button>
                    <textarea id="inputBox" placeholder="Describe the logic in plain English, or paste rungs (neutral/ASCII)   (Enter = send, Shift+Enter = new line)"></textarea>
                    <button id="enterButton" title="Send" disabled>Enter</button>
                </div>
            </div>
            <input type="file" id="fileInput" accept=".l5x,.L5X" hidden />
        </div>

        <div id="settingsModal" class="modal">
            <div class="modal-content">
                <span class="close-button" title="Close">&times;</span>
                <h2>Settings</h2>
                <p class="modal-description">Saved in this browser. Applied to the next message.</p>
                <input id="setModel" type="hidden" />
                <div class="settings-grid">
                    <div class="settings-section">Model (runs on this PC)</div>

                    <label for="setBackend">Runs on</label>
                    <select id="setBackend">
                        <option value="ollama">Ollama</option>
                        <option value="llamacpp">llama.cpp server (direct GGUF, grammar-checked)</option>
                        <option value="openai">OpenAI-compatible server (LM Studio, Jan, vLLM)</option>
                    </select>
                    <div></div>
                    <div id="backendHelp" class="settings-help"></div>

                    <label for="setLlmUrl">Server address</label>
                    <input id="setLlmUrl" type="text" />

                    <label for="setModelSelect">Model</label>
                    <div class="model-pick">
                        <select id="setModelSelect"></select>
                        <button id="refreshModels" class="modal-button small" title="Reload the model list">⟳</button>
                    </div>
                    <div></div>
                    <div class="model-extra">
                        <input id="setModelCustom" type="text" placeholder="model name, e.g. qwen3.6:35b-a3b" hidden />
                        <div id="modelStatus" class="settings-help"></div>
                    </div>

                    <label for="setThink" class="think-row" title="Qwen3 and similar models think before answering; slow on CPU">Model thinking</label>
                    <select id="setThink" class="think-row">
                        <option value="default">Model default</option>
                        <option value="off">Off (faster)</option>
                    </select>

                    <div class="settings-section">Output</div>

                    <label for="setOutput">Download as</label>
                    <select id="setOutput">
                        <option value="rungs">Rungs (paste into a routine)</option>
                        <option value="routine">New routine</option>
                    </select>

                    <label for="setRoutine">Routine name</label>
                    <input id="setRoutine" type="text" />

                    <label for="setProgram">Program</label>
                    <input id="setProgram" type="text" list="programList" />
                    <datalist id="programList"></datalist>

                    <label for="setController">Controller name</label>
                    <input id="setController" type="text" />

                    <label for="setRevision" title="36+ uses GT/EQ/MOVE, older uses GRT/EQU/MOV">Logix Designer version</label>
                    <input id="setRevision" type="text" />

                    <label for="setScope">New tags in</label>
                    <select id="setScope">
                        <option value="controller">Controller scope</option>
                        <option value="program">Program scope</option>
                    </select>

                    <label for="setDisplay">Timer/counter operands</label>
                    <select id="setDisplay">
                        <option value="placeholder">TON(T,?,?) &mdash; as Studio 5000 exports (recommended)</option>
                        <option value="values">TON(T,5000,0)</option>
                    </select>

                    <label for="setPrefix">Auto tag prefix</label>
                    <input id="setPrefix" type="text" />

                    <label for="setComments">Rung comments</label>
                    <input id="setComments" type="checkbox" />
                </div>
                <div class="modal-actions">
                    <button id="resetSettings" class="modal-button">Reset</button>
                    <button id="saveSettings" class="modal-button primary-button">Save</button>
                </div>
            </div>
        </div>
    </main>

    <footer>LLM4L5X &middot; runs locally &middot; review every rung before importing</footer>

    <script src="{{ url_for('static', filename='app.js') }}"></script>
</body>
</html>
