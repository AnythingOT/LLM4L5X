{% extends "base.html" %}
{% block title %}Chat{% endblock %}
{% block header_middle %}
<span id="projectBadge" class="project-badge" hidden>
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M14 3H6a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V9z"/><path d="M14 3v6h6"/></svg><span id="projectName"></span>
    <button id="detachButton" title="Detach project">&times;</button>
</span>
{% endblock %}
{% block header_right %}
<a id="modelBadge" class="model-badge" href="/settings" title="Model connection - click to change">
    <span id="modelDot" class="dot"></span><span id="modelBadgeText">model</span>
</a>
<button id="clearButton" class="icon-btn" title="Clear the chat (or type cls). The attached file stays." aria-label="Clear the chat"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16"/><path d="M9 7V4h6v3"/><path d="M6 7l1 13h10l1-13"/></svg><span class="label">Clear</span></button>
{% endblock %}

{% block body %}
<main id="container">
    <div id="chatWindow"></div>

    <div id="inputWrapper">
        <div class="chips" id="chips" hidden>
            <span class="chips-label">Examples:</span>
            <button class="chip logic-only" data-text="Start the pump with the start button and keep it running until the stop button is pressed or the pump faults.">pump start/stop</button>
            <button class="chip logic-only" data-text="Raise the high level alarm when the level stays above 80 for 5 seconds, unless the alarm is muted.">delayed alarm</button>
            <button class="chip logic-only" data-text="Count parts on the part sensor; the batch is complete at 10 parts. Reset the count with the reset button.">counter</button>
            <button class="chip logic-only" data-text="XIC(Start)[XIC(Run) ,XIO(Stop) ]OTE(Motor);">neutral rung</button>
            <button class="chip logic-only" data-text="XIC Start BST XIC Run NXB XIO Stop BND OTE Motor">ASCII rung</button>
            <button class="chip udt-only" data-text="A motor UDT: running and faulted bits, speed in rpm, run hours, the last fault code and 32 alarm bits." hidden>motor UDT</button>
            <button class="chip udt-only" data-text="A tank with level and temperature, a high level alarm, and two pumps that each have a run command, a running feedback and a speed setpoint." hidden>tank with pumps</button>
            <button class="chip udt-only" data-text='UDT Valve "On/off valve";&#10;Open_Cmd BOOL "Open command";&#10;Opened_LS BOOL "Open limit switch";&#10;Travel_TMR TIMER "Travel time";' hidden>UDT text form</button>
            <span class="chip-pair logic-only"><button class="chip" data-attach="/api/spec/sample" data-name="Requirements_sample.xlsx" title="Attach the sample workbook and build it">Requirements Excel sample</button><a class="chip chip-dl" href="/api/spec/sample" download title="Download the sample to edit it in Excel" aria-label="Download the requirements sample">&#8595;</a></span>
            <span class="chip-pair udt-only" hidden><button class="chip" data-attach="/api/udt/template" data-name="UDT_sample.xlsx" title="Attach the sample sheet and build its UDTs">UDT Excel sample</button><a class="chip chip-dl" href="/api/udt/template" download title="Download the sample to edit it in Excel" aria-label="Download the UDT sample">&#8595;</a></span>
        </div>
        <div class="chips chips-file project-only" id="fileChips" hidden>
            <span class="chips-label">Attached file:</span>
            <button class="chip" data-send="summary">summary</button>
            <button class="chip rungs-only" data-send="decompile">explain all rungs</button>
            <button class="chip rungs-only" data-send="validate">validate</button>
            <button class="chip" data-send="optimize">optimize UDTs</button>
        </div>
        <div class="input-with-buttons">
            <button id="attachButton" class="tool-btn" title="Attach an .L5X export, or an Excel sheet of UDTs"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M21 11.5l-8.6 8.6a5 5 0 0 1-7.1-7.1l8.6-8.6a3.4 3.4 0 0 1 4.8 4.8l-8.6 8.6a1.7 1.7 0 0 1-2.4-2.4l7.9-7.9"/></svg><span class="label">Attach</span></button>
            <div id="modeToggle" class="mode-toggle" role="group" aria-label="What to create">
                <button data-mode="logic" title="Describe logic, or paste rungs">Logic</button>
                <button data-mode="udt" title="Describe a UDT (data type)">UDT</button>
            </div>
            <textarea id="inputBox" rows="1" aria-label="Message"></textarea>
            <button id="examplesButton" class="tool-btn" title="Examples and commands" aria-expanded="false" aria-label="Examples and commands"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h16M4 12h10M4 18h7"/></svg></button>
            <button id="enterButton" class="tool-btn" title="Send (Enter)" disabled>Send</button>
        </div>
        <input type="file" id="fileInput" accept=".l5x,.L5X,.xlsx,.xlsm" hidden />
    </div>
</main>

{% endblock %}
{% block scripts %}<script src="{{ url_for('static', filename='app.js') }}"></script>{% endblock %}
